<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wiom Music — har jagah ka apna gaana</title>
<meta name="description" content="Swipe karo, jagah badlo, gaana chalta rahe. 30 vibe channels — TV wale gaane se lekar highway tak.">
<meta name="theme-color" content="#1D1428">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Noto+Sans:ital,wght@0,400;0,600;0,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="feed" aria-label="Channels"></div>

<div class="fx-vignette"></div>
<div class="fx-grain"></div>

<header id="topbar">
  <div id="clock">–:–</div>
  <div class="presence"><span class="dot"></span><b id="presence-count">–</b>&nbsp;<span id="presence-noun">yahan hain</span></div>
  <div id="top-actions">
    <a id="yt-pill" href="#" target="_blank" rel="noopener noreferrer" aria-label="YouTube playlist kholo">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2a2.8 2.8 0 0 0-1.97-1.98C17.9 4.75 12 4.75 12 4.75s-5.9 0-7.63.47A2.8 2.8 0 0 0 2.4 7.2 29.3 29.3 0 0 0 1.93 12c0 1.62.16 3.23.47 4.8a2.8 2.8 0 0 0 1.97 1.98c1.73.47 7.63.47 7.63.47s5.9 0 7.63-.47a2.8 2.8 0 0 0 1.97-1.98c.31-1.57.47-3.18.47-4.8s-.16-3.23-.47-4.8zM9.95 15.02V8.98L15.2 12l-5.25 3.02z"/></svg>
      <span>Playlist</span>
    </a>
    <button id="share-btn" aria-label="Share channel">↗</button>
  </div>
</header>

<div id="toast" class="hidden"></div>

<div id="tvset" aria-hidden="true">
  <div id="tv-shadow"></div>
  <svg id="tv-cabinet" viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg">
    <!-- antenna -->
    <g stroke="#2b2138" stroke-width="3" stroke-linecap="round">
      <line x1="130" y1="42" x2="96" y2="10"/>
      <line x1="130" y1="42" x2="168" y2="12"/>
    </g>
    <circle cx="96" cy="10" r="4" fill="#2b2138"/><circle cx="168" cy="12" r="4" fill="#2b2138"/>
    <!-- cabinet -->
    <rect x="10" y="38" width="240" height="152" rx="18" fill="#5a3d2b"/>
    <rect x="10" y="38" width="240" height="12" rx="6" fill="#6e4c35"/>
    <rect x="10" y="176" width="240" height="14" rx="7" fill="#452c1d"/>
    <!-- feet -->
    <rect x="38" y="186" width="26" height="12" rx="4" fill="#3f2a1d"/>
    <rect x="196" y="186" width="26" height="12" rx="4" fill="#3f2a1d"/>
    <!-- screen bezel -->
    <rect x="22" y="52" width="168" height="126" rx="12" fill="#2b1c14"/>
    <rect x="27" y="57" width="158" height="116" rx="9" fill="#0d0913"/>
    <!-- right control panel -->
    <rect x="200" y="58" width="44" height="114" rx="8" fill="#4a3122"/>
    <circle cx="222" cy="80" r="10" fill="#caa46a"/><circle cx="222" cy="80" r="4" fill="#5a3d2b"/>
    <circle cx="222" cy="108" r="10" fill="#caa46a"/><circle cx="222" cy="108" r="4" fill="#5a3d2b"/>
    <g fill="#3f2a1d"><rect x="210" y="132" width="24" height="3" rx="1.5"/><rect x="210" y="140" width="24" height="3" rx="1.5"/><rect x="210" y="148" width="24" height="3" rx="1.5"/><rect x="210" y="156" width="24" height="3" rx="1.5"/></g>
  </svg>
  <div id="yt-screen"><div id="yt-holder"><div id="yt"></div></div></div>
  <div id="tv-glass"></div>
</div>

<div id="pill">
  <div id="disc-wrap"><img id="disc" src="" alt=""><span id="disc-pin"></span></div>
  <div id="np">
    <p id="np-title">…</p>
    <p id="np-sub">…</p>
    <div id="bar"><div id="bar-fill"></div></div>
    <p id="np-time"><span id="t-cur">0:00</span> / <span id="t-tot">0:00</span></p>
  </div>
  <div id="controls">
    <button id="prev" aria-label="Pichla"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
    <button id="pp" aria-label="Play/Pause"><svg id="ic-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg id="ic-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
    <button id="next" aria-label="Agla"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg></button>
  </div>
</div>

<button id="unmute" class="hidden">🔇 sound on karo</button>
<div id="coach-swipe" class="coach hidden">⬆ swipe — nayi jagah, naya vibe</div>

<a id="wiom-cta" href="https://wiom.tv" target="_blank" rel="noopener">Wiom TV pe 250+ channels FREE →</a>

<script src="app.js"></script>
</body>
</html>
